<style>
:root{--bg:#fafafa;--fg:#111;--muted:#555;--accent:#0b57d0}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{text-align:center;padding:2rem}
h1{margin:0 0 1.25rem;font-size:clamp(2.25rem,8vw,4rem);font-weight:600;letter-spacing:-.03em;line-height:1.1}
a{color:var(--accent);font-size:clamp(1.05rem,3.5vw,1.35rem);text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px;transition:border-color .2s}
a:hover,a:focus-visible{border-bottom-color:currentColor;outline:none}
</style>
</head>
